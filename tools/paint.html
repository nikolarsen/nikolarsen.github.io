<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Краска и грунт — Строительные web-инструменты</title>
<meta name="description" content="Калькулятор краски: площадь стен без окон и дверей, литры в слоях, банки под покупку, грунтовка.">
<meta name="theme-color" content="#0d141d">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css?v=20261125g">
</head>
<body class="tool-page">

<header class="top">
  <div class="wrap top__in">
    <a class="backlink" href="../">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Все инструменты
    </a>
    <nav class="top__nav">
      <a class="top__link" href="../#tools">Инструменты</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему" title="Тема">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap tool">
  <h1 class="sr-only">Краска и грунт</h1>

  <div class="panel">
    <div class="form">
      <div class="field">
        <label for="len">Длина комнаты, м</label>
        <input id="len" type="number" inputmode="decimal" min="0" step="0.1" value="4.5">
      </div>
      <div class="field">
        <label for="wid">Ширина комнаты, м</label>
        <input id="wid" type="number" inputmode="decimal" min="0" step="0.1" value="3">
      </div>
      <div class="field">
        <label for="h">Высота стен, м</label>
        <input id="h" type="number" inputmode="decimal" min="1" step="0.05" value="2.7">
      </div>
      <div class="field">
        <label for="open">Окна и двери, м²</label>
        <input id="open" type="number" inputmode="decimal" min="0" step="0.1" value="4">
      </div>
      <div class="field">
        <label for="paint">Краска</label>
        <select id="paint">
          <option value="0.15" selected>Водоэмульс. · 0,15</option>
          <option value="0.12">Латексная · 0,12</option>
          <option value="0.18">Фасадная · 0,18</option>
          <option value="0.11">Эмаль · 0,11</option>
        </select>
        <small>расход на один слой</small>
      </div>
      <div class="field">
        <label for="layers">Слоёв</label>
        <select id="layers">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </div>
    </div>

    <div class="result">
      <div class="result__head"><b>Результат</b><span>с запасом 5 % на потери</span></div>
      <div class="result__grid">
        <div class="out"><span>Площадь стен</span><b id="oArea">—</b></div>
        <div class="out"><span>Краска</span><b id="oPaint">—</b></div>
        <div class="out"><span>Банки</span><b id="oCans">—</b></div>
        <div class="out"><span>Грунт</span><b id="oPrimer">—</b></div>
      </div>
      <p class="note">Грунт — один слой, 0,1 л/м². Краску берите с небольшим запасом на подкрас: партии разных дат могут отличаться по оттенку, поэтому остаток лучше сохранить.</p>
    </div>
  </div>
</main>

<script src="../assets/app.js?v=20261125g" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ids = ['len','wid','h','open','paint','layers'];
  var LOSS = 0.05;

  function num(id, def) { var v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) && v >= 0 ? v : def; }
  function fmt0(n) { return n.toLocaleString('ru-RU', { maximumFractionDigits: 0 }); }
  function fmt1(n) { return n.toLocaleString('ru-RU', { maximumFractionDigits: 1 }); }

  // минимальная закупка банками 9 / 2,5 / 1 л: сначала по объёму, потом по числу банок
  function cans(need) {
    var best = null;
    var max9 = Math.ceil(need / 9) + 1;
    for (var a = 0; a <= max9; a++) {
      for (var b = 0; b <= Math.ceil(need / 2.5) + 1; b++) {
        var rest = need - a * 9 - b * 2.5;
        var c = Math.max(0, Math.ceil(rest - 1e-9));
        var vol = a * 9 + b * 2.5 + c;
        if (vol + 1e-9 < need) continue;
        var count = a + b + c;
        var score = [vol, count];
        if (!best || score[0] < best.score[0] - 1e-9 || (Math.abs(score[0] - best.score[0]) < 1e-9 && score[1] < best.score[1])) {
          best = { score: score, a: a, b: b, c: c };
        }
      }
    }
    if (!best) return '';
    var parts = [];
    if (best.a) parts.push(best.a + '×9 л');
    if (best.b) parts.push(best.b + '×2,5 л');
    if (best.c) parts.push(best.c + '×1 л');
    return parts.join(' + ');
  }

  function calc() {
    var L = num('len', 0), W = num('wid', 0), H = num('h', 0);
    var open = num('open', 0);
    var rate = num('paint', 0.15), layers = num('layers', 2);

    var area = Math.max(0, 2 * (L + W) * H - open);
    if (!(area > 0)) {
      ['oArea','oPaint','oCans','oPrimer'].forEach(function (k) { $(k).textContent = '—'; });
      return;
    }

    var paint = area * rate * layers;
    var buy = paint * (1 + LOSS);
    var primer = area * 0.1;

    $('oArea').innerHTML = fmt1(area) + ' <i>м²</i>';
    $('oPaint').innerHTML = fmt1(paint) + ' <i>л</i>';
    $('oCans').innerHTML = fmt1(buy) + ' <i>л: ' + cans(buy) + '</i>';
    $('oPrimer').innerHTML = fmt1(primer) + ' <i>л</i>';
  }

  ids.forEach(function (id) { $(id).addEventListener('input', calc); $(id).addEventListener('change', calc); });
  calc();
})();
</script>
</body>
</html>
