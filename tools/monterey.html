<style>
  .mr { --mr-accent: #2f6fe0; --mr-canvas: #1a1f24; }
  :root[data-theme="dark"] .mr { --mr-accent: #6f9bff; }

  .mr-body { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }

  .mr-params { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .mr-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mr-field label {
    font-size: 10.5px; color: var(--muted); font-weight: 500; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mr-field input {
    width: 100%; height: 38px; padding: 0 4px; text-align: center;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 9px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .mr-field input:focus { border-color: var(--mr-accent); }
  .mr-field--primary input { border-color: color-mix(in srgb, var(--mr-accent) 45%, var(--line)); }
  .mr-field--first input { border-color: rgba(48, 209, 88, .45); }

  .mr-canvas {
    flex: 1 1 auto; min-height: 160px; position: relative;
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    background: var(--mr-canvas); border: 1px solid var(--line); border-radius: 14px;
  }
  .mr-canvas canvas { display: block; }

  .mr-legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    font-size: 10px; color: var(--muted); letter-spacing: .01em;
  }
  .mr-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .mr-legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
  .mr-legend .w1 i { background: #ff9f0a; }
  .mr-legend .w2 i { background: #0a84ff; }
  .mr-legend .l i  { background: #30d158; height: 8px; }
  .mr-legend .g i  { background: #bf5af2; }
  .mr-legend .t i  { background: #64d2ff; }
</style>
</head>

<main class="wrap tool mr">
  <h1 class="sr-only">Волны Монтерея и обрешётка</h1>
  <div class="panel panel--fill">
    <div class="mr-body">

      <div class="mr-params">
        <div class="mr-field mr-field--primary">
          <label for="lengthInput">Длина, мм</label>
          <input id="lengthInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="2000">
        </div>
        <div class="mr-field">
          <label for="waveOffsetInput">До 1-й волны</label>
          <input id="waveOffsetInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="35">
        </div>
        <div class="mr-field">
          <label for="waveStepInput">Шаг волны</label>
          <input id="waveStepInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="350">
        </div>
        <div class="mr-field">
          <label for="waveFromTopInput">Волна от верха</label>
          <input id="waveFromTopInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="30">
        </div>
        <div class="mr-field">
          <label for="lathOffsetInput">Низ 1-й обреш.</label>
          <input id="lathOffsetInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="70">
        </div>
        <div class="mr-field mr-field--first">
          <label for="firstLathWidthInput">Ширина 1-й</label>
          <input id="firstLathWidthInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="100">
        </div>
        <div class="mr-field">
          <label for="lathWidthInput">Ширина обреш.</label>
          <input id="lathWidthInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" value="100">
        </div>
      </div>

      <div class="mr-canvas" id="scrollWrap">
        <canvas id="sheetCanvas"></canvas>
      </div>

      <div class="mr-legend">
        <span class="w1"><i></i>В1</span>
        <span class="w2"><i></i>волны</span>
        <span class="l"><i></i>обрешётка</span>

        <span class="t"><i></i>остаток до волны</span>
      </div>

    </div>
  </div>
</main>

<script src="../assets/app.js?v=20261126a" defer></script>
<script>
const MIN_SCALE = 0.15;
  const MAX_SCALE = 1.4;

  const canvas     = document.getElementById('sheetCanvas');
  const ctx        = canvas.getContext('2d');
  const scrollWrap = document.getElementById('scrollWrap');

  const inputs = {
    length:          document.getElementById('lengthInput'),
    waveOffset:      document.getElementById('waveOffsetInput'),
    waveStep:        document.getElementById('waveStepInput'),
    lathOffset:      document.getElementById('lathOffsetInput'),
    firstLathWidth:  document.getElementById('firstLathWidthInput'),
    lathWidth:       document.getElementById('lathWidthInput'),
    waveFromTop:     document.getElementById('waveFromTopInput'),
  };
  const DEFAULTS = {
    length: 2000, waveOffset: 35, waveStep: 350,
    lathOffset: 70, firstLathWidth: 100,
    lathWidth: 100, waveFromTop: 30
  };
  const LIMITS = {
    length:         [100, 15000],
    waveOffset:     [0,   5000],
    waveStep:       [50,  2000],
    lathOffset:     [0,   5000],
    firstLathWidth: [10,  500],
    lathWidth:      [10,  500],
    waveFromTop:    [0,   500],
  };

  function setupInput(input, key) {
    input.addEventListener('focus', function() {
      setTimeout(() => this.select(), 30);
    });
    input.addEventListener('click', function() { this.select(); });
    input.addEventListener('input', function() {
      const c = this.value.replace(/[^0-9]/g, '');
      if (c !== this.value) this.value = c;
      scheduleDraw();
    });
    input.addEventListener('change', function() {
      const v = clampValue(this, key);
      this.value = String(v);
      scheduleDraw();
    });
  }
  function clampValue(input, key) {
    const [min, max] = LIMITS[key];
    let v = parseInt(input.value.replace(/[^0-9]/g, ''), 10);
    if (isNaN(v)) v = DEFAULTS[key];
    if (v < min) v = min;
    if (v > max) v = max;
    return v;
  }
  function val(key) { return clampValue(inputs[key], key); }

  let drawScheduled = false;
  function scheduleDraw() {
    if (drawScheduled) return;
    drawScheduled = true;
    requestAnimationFrame(() => { drawScheduled = false; draw(); });
  }

  // Универсальный вертикальный размер СНАРУЖИ листа
  function drawVDimOutside(d1, d2, label, color, xDim, side, sheetX, sheetW, yAt) {
    const yA = yAt(d1), yB = yAt(d2);
    const yTop = Math.min(yA, yB), yBot = Math.max(yA, yB);
    const yc = (yTop + yBot) / 2;

    ctx.setLineDash([2, 3]);
    ctx.strokeStyle = color + '99';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sheetX + sheetW + 2, yTop); ctx.lineTo(xDim, yTop);
    ctx.moveTo(sheetX + sheetW + 2, yBot); ctx.lineTo(xDim, yBot);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(xDim, yTop); ctx.lineTo(xDim, yBot);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(xDim - 4, yTop + 5); ctx.lineTo(xDim, yTop); ctx.lineTo(xDim + 4, yTop + 5);
    ctx.moveTo(xDim - 4, yBot - 5); ctx.lineTo(xDim, yBot); ctx.lineTo(xDim + 4, yBot - 5);
    ctx.stroke();

    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(xDim - 4, yTop); ctx.lineTo(xDim + 4, yTop);
    ctx.moveTo(xDim - 4, yBot); ctx.lineTo(xDim + 4, yBot);
    ctx.stroke();

    ctx.font = 'bold 11px -apple-system, sans-serif';
    const tw = ctx.measureText(label).width;
    const pad = 4;
    const bw = tw + pad * 2;
    const bh = 15;
    const lx = side === 'l' ? xDim - 8 - bw : xDim + 8;
    const ly = yc - bh / 2;

    ctx.fillStyle = '#1c1c1e';
    ctx.fillRect(lx, ly, bw, bh);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(lx, ly, bw, bh);

    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + pad, yc);
  }

  // Вертикальный размер ВНУТРИ листа
  function drawVDimInside(d1, d2, label, color, xDim, yAt) {
    const yA = yAt(d1), yB = yAt(d2);
    const yTop = Math.min(yA, yB), yBot = Math.max(yA, yB);
    const yc = (yTop + yBot) / 2;

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(xDim, yTop); ctx.lineTo(xDim, yBot);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(xDim - 4, yTop + 5); ctx.lineTo(xDim, yTop); ctx.lineTo(xDim + 4, yTop + 5);
    ctx.moveTo(xDim - 4, yBot - 5); ctx.lineTo(xDim, yBot); ctx.lineTo(xDim + 4, yBot - 5);
    ctx.stroke();

    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(xDim - 4, yTop); ctx.lineTo(xDim + 4, yTop);
    ctx.moveTo(xDim - 4, yBot); ctx.lineTo(xDim + 4, yBot);
    ctx.stroke();

    ctx.font = 'bold 11px -apple-system, sans-serif';
    const tw = ctx.measureText(label).width;
    const pad = 4;
    const bw = tw + pad * 2;
    const bh = 15;
    const lx = xDim - 8 - bw;
    const ly = yc - bh / 2;

    ctx.fillStyle = '#1c1c1e';
    ctx.fillRect(lx, ly, bw, bh);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(lx, ly, bw, bh);

    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + pad, yc);
  }

  function draw() {
    const L             = val('length');
    const waveOffset    = val('waveOffset');
    const waveStep      = val('waveStep');
    const lathOffset    = val('lathOffset');
    const firstLathW    = val('firstLathWidth');
    const lathWidth     = val('lathWidth');
    const waveFromTop   = val('waveFromTop');

    const dpr = window.devicePixelRatio || 1;
    const vpW = scrollWrap.clientWidth;
    const vpH = scrollWrap.clientHeight;

    const PAD_TOP    = 30;
    const PAD_BOTTOM = 30;
    const PAD_LEFT   = 66;
    const PAD_RIGHT  = 170;

    const fitScale = (vpH - PAD_TOP - PAD_BOTTOM) / L;
    const scalePx  = Math.max(MIN_SCALE, Math.min(fitScale, MAX_SCALE));

    const contentH   = PAD_TOP + L * scalePx + PAD_BOTTOM;
    const canvasCssH = Math.max(vpH, contentH);
    const canvasCssW = vpW;

    canvas.width  = Math.floor(canvasCssW * dpr);
    canvas.height = Math.floor(canvasCssH * dpr);
    canvas.style.width  = canvasCssW + 'px';
    canvas.style.height = canvasCssH + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvasCssW, canvasCssH);

    const sheetX = PAD_LEFT;
    const sheetW = canvasCssW - PAD_LEFT - PAD_RIGHT;
    const sheetTop    = PAD_TOP;
    const sheetBottom = sheetTop + L * scalePx;

    const yAt = d => sheetBottom - d * scalePx;

    // ===== ВОЛНЫ =====
    const waves = [];
    if (waveStep > 0) {
      let p = waveOffset, g = 0;
      while (p <= L && g < 10000) { waves.push(p); p += waveStep; g++; }
    }

    // ===== ОБРЕШЁТКИ =====
    // О1 — своя ширина (firstLathW); остальные — общая (lathWidth)
    const laths = [];
    laths.push({
      start: lathOffset,
      end:   Math.min(lathOffset + firstLathW, L + firstLathW),
      waveIndex: -1,
      isFinal:   false,
    });
    for (let i = 1; i < waves.length; i++) {
      const w = waves[i];
      const end   = w + waveFromTop;
      const start = end - lathWidth;
      laths.push({ start, end, waveIndex: i, isFinal: false });
    }

    let visibleLaths = laths.filter(r => r.end > 0 && r.start < L);

    // Финальная доска
    const lastW = visibleLaths[visibleLaths.length - 1];
    if (lastW) {
      const finalStart = L - lathWidth;
      if (finalStart > lastW.end) {
        visibleLaths.push({
          start: finalStart,
          end:   L,
          waveIndex: -2,
          isFinal:   true,
        });
      }
    }

    // ===== ФОН =====
    ctx.fillStyle = '#3a3a3c';
    ctx.fillRect(sheetX, sheetTop, sheetW, L * scalePx);
    ctx.strokeStyle = '#636366';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sheetX, sheetTop, sheetW, L * scalePx);

    // ===== ОБРЕШЁТКИ =====
    visibleLaths.forEach((r, i) => {
      const yTop = yAt(Math.min(r.end, L));
      const yBot = yAt(Math.max(r.start, 0));

      if (r.isFinal) {
        ctx.fillStyle = 'rgba(48, 209, 88, 0.42)';
      } else if (i === 0) {
        // первая доска — чуть светлее
        ctx.fillStyle = 'rgba(48, 209, 88, 0.38)';
      } else {
        ctx.fillStyle = 'rgba(48, 209, 88, 0.30)';
      }
      ctx.fillRect(sheetX, yTop, sheetW, yBot - yTop);

      ctx.strokeStyle = '#30d158';
      ctx.lineWidth = r.isFinal ? 1.5 : 1;
      ctx.strokeRect(sheetX, yTop, sheetW, yBot - yTop);
    });

    // ===== ВОЛНЫ =====
    const waveAlign = [];
    waves.forEach(w => {
      let found = null;
      for (let li = 0; li < visibleLaths.length; li++) {
        const r = visibleLaths[li];
        if (w >= r.start && w <= r.end) {
          found = {
            lathIndex: li,
            fromTop:   r.end - w,
            fromBottom: w - r.start,
          };
          break;
        }
      }
      waveAlign.push(found);
    });

    waves.forEach((w, i) => {
      const y = yAt(w);
      const isFirst = i === 0;
      const color = isFirst ? '#ff9f0a' : '#0a84ff';
      ctx.beginPath();
      ctx.moveTo(sheetX, y);
      ctx.lineTo(sheetX + sheetW, y);
      ctx.strokeStyle = color;
      ctx.lineWidth = isFirst ? 2.5 : 1.6;
      ctx.stroke();
    });

    // ===== 0 и L =====
    ctx.fillStyle = '#8e8e93';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('0', sheetX + 4, sheetBottom + 14);
    ctx.fillText(L + ' мм', sheetX + 4, sheetTop - 14);

    ctx.strokeStyle = '#8e8e93';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sheetX - 3, sheetBottom); ctx.lineTo(sheetX + 3, sheetBottom);
    ctx.moveTo(sheetX - 3, sheetTop);    ctx.lineTo(sheetX + 3, sheetTop);
    ctx.stroke();

    // ===== ПОДПИСИ ВОЛН СЛЕВА =====
    ctx.textBaseline = 'middle';
    waves.forEach((w, i) => {
      const y = yAt(w);
      const isFirst = i === 0;
      const color = isFirst ? '#ff9f0a' : '#0a84ff';
      const align = waveAlign[i];

      let dotColor;
      if (!align) dotColor = '#ff453a';
      else if (Math.abs(align.fromTop - waveFromTop) <= 3) dotColor = '#30d158';
      else dotColor = '#ff9f0a';

      ctx.beginPath();
      ctx.moveTo(sheetX - 4, y); ctx.lineTo(sheetX, y);
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sheetX - 56, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = dotColor;
      ctx.fill();

      ctx.fillStyle = color;
      ctx.font = 'bold 10px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('В' + (i + 1), sheetX - 50, y - 6);

      ctx.fillStyle = '#e5e5ea';
      ctx.font = 'bold 10px -apple-system, sans-serif';
      ctx.fillText(Math.round(w) + ' мм', sheetX - 50, y + 6);
    });

    // Шаг волны
    if (waves.length >= 2) {
      const y1 = yAt(waves[0]), y2 = yAt(waves[1]);
      const x  = sheetX - 30;
      ctx.strokeStyle = '#5a5a5e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y1); ctx.lineTo(x, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, y1 + 3); ctx.lineTo(x, y1); ctx.lineTo(x + 3, y1 + 3);
      ctx.moveTo(x - 3, y2 - 3); ctx.lineTo(x, y2); ctx.lineTo(x + 3, y2 - 3);
      ctx.stroke();
      ctx.fillStyle = '#8e8e93';
      ctx.font = 'bold 9px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(Math.round(waves[1] - waves[0])), x, (y1 + y2) / 2 - 7);
    }

    // ===== ПОДПИСИ ОБРЕШЁТОК СПРАВА =====
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 10px -apple-system, sans-serif';
    visibleLaths.forEach((r, i) => {
      const yTopVis = yAt(Math.min(r.end, L));
      const yBotVis = yAt(Math.max(r.start, 0));
      const yc = (yTopVis + yBotVis) / 2;

      ctx.beginPath();
      ctx.moveTo(sheetX + sheetW, yc);
      ctx.lineTo(sheetX + sheetW + 4, yc);
      ctx.strokeStyle = '#30d158'; ctx.lineWidth = 1;
      ctx.stroke();

      let label = 'О' + (i + 1);
      if (r.isFinal) label += '*';
      ctx.fillStyle = '#30d158';
      ctx.fillText(label, sheetX + sheetW + 6, yc);

      const labelW = ctx.measureText(label).width;
      ctx.fillStyle = '#e5e5ea';
      ctx.fillText(
        ' ' + Math.round(r.start) + '–' + Math.round(r.end),
        sheetX + sheetW + 6 + labelW, yc
      );
    });

    // Ширина О1 — стрелка с числом firstLathW
    if (visibleLaths.length >= 1) {
      const r = visibleLaths[0];
      const yTop = yAt(Math.min(r.end, L));
      const yBot = yAt(Math.max(r.start, 0));
      const x = sheetX + sheetW - 8;

      ctx.strokeStyle = '#30d158'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, yTop); ctx.lineTo(x, yBot);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, yTop + 3); ctx.lineTo(x, yTop); ctx.lineTo(x + 3, yTop + 3);
      ctx.moveTo(x - 3, yBot - 3); ctx.lineTo(x, yBot); ctx.lineTo(x + 3, yBot - 3);
      ctx.stroke();

      ctx.fillStyle = '#30d158';
      ctx.font = 'bold 9px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(String(Math.round(r.end - r.start)), x - 4, (yTop + yBot) / 2);
      ctx.textAlign = 'left';
    }

    // Волна от верхнего края обрешётки — на первой выровненной
    const firstAligned = visibleLaths.find(r => r.waveIndex >= 0);
    if (firstAligned) {
      const w = waves[firstAligned.waveIndex];
      const yTop = yAt(firstAligned.end);
      const yWave = yAt(w);
      const x = sheetX + sheetW - 24;

      ctx.strokeStyle = '#30d158'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, yTop); ctx.lineTo(x, yWave);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, yTop + 3); ctx.lineTo(x, yTop); ctx.lineTo(x + 3, yTop + 3);
      ctx.moveTo(x - 3, yWave - 3); ctx.lineTo(x, yWave); ctx.lineTo(x + 3, yWave - 3);
      ctx.stroke();

      ctx.fillStyle = '#30d158';
      ctx.font = 'bold 9px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(
        String(Math.round(firstAligned.end - w)) + ' мм',
        x - 4, (yTop + yWave) / 2
      );
      ctx.textAlign = 'left';
    }

    // ===== РАЗМЕРЫ СПРАВА =====
    const X_GAP = sheetX + sheetW + 120;

    // Зазор О1↔О2 — пересчитается автоматически, т.к. берётся r1.end (по новой ширине О1)
    if (visibleLaths.length >= 2) {
      const r1 = visibleLaths[0];
      const r2 = visibleLaths[1];
      const gap = Math.round(r2.start - r1.end);
      drawVDimOutside(r1.end, r2.start, gap + ' мм', '#bf5af2',
                      X_GAP, 'l', sheetX, sheetW, yAt);
    }

    // Зазор последних двух досок
    if (visibleLaths.length >= 3) {
      const n = visibleLaths.length;
      const r1 = visibleLaths[n - 2];
      const r2 = visibleLaths[n - 1];
      const gap = Math.round(r2.start - r1.end);
      drawVDimOutside(r1.end, r2.start, gap + ' мм', '#bf5af2',
                      X_GAP, 'r', sheetX, sheetW, yAt);
    }

    // ===== ОСТАТОК ДО ВОЛНЫ — ВНУТРИ ЛИСТА =====
    if (waves.length > 0) {
      const lastWave = waves[waves.length - 1];
      const remainder = L - lastWave;
      if (remainder > 1) {
        const xInside = sheetX + sheetW - 30;
        drawVDimInside(lastWave, L,
          Math.round(remainder) + ' мм', '#64d2ff',
          xInside, yAt);
      }
    }
  }

  Object.keys(inputs).forEach(k => setupInput(inputs[k], k));
  window.addEventListener('resize', scheduleDraw);

  requestAnimationFrame(() => {
    draw();
    requestAnimationFrame(() => {
      scrollWrap.scrollTop = scrollWrap.scrollHeight;
    });
  });
</script>
</body>
</html>
